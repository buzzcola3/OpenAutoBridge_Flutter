name: Release Builds

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: buzzcola3/openautoflutter-builder

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            flutter_arch: x64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            flutter_arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull builder image (${{ matrix.arch }})
        run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.arch }}

      - name: Build example app (${{ matrix.arch }})
        run: |
          docker run --rm -t \
            -v "$PWD:/workspace" \
            -w /workspace/example \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.arch }} \
            flutter build linux -v

      - name: Package bundle (${{ matrix.arch }})
        run: |
          mkdir -p dist
          tar -C example/build/linux/${{ matrix.flutter_arch }}/release/bundle -czf dist/openautoflutter_example-linux-${{ matrix.arch }}.tar.gz .

      - name: Upload release asset (${{ matrix.arch }})
        uses: softprops/action-gh-release@v2
        with:
          files: dist/openautoflutter_example-linux-${{ matrix.arch }}.tar.gz

      - name: Build flutter-drm bundle (${{ matrix.arch }})
        run: |
          docker run --rm -t \
            -v "$PWD:/workspace" \
            -w /workspace \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.arch }} \
            bash scripts/build_flutter_drm_release_${{ matrix.arch }}.sh /workspace/example

      - name: Package flutter-drm bundle (${{ matrix.arch }})
        run: |
          mkdir -p dist
          tar -C dist/flutter-drm-${{ matrix.arch }} -czf dist/openautoflutter_example-flutter-drm-${{ matrix.arch }}.tar.gz .

      - name: Upload flutter-drm release asset (${{ matrix.arch }})
        uses: softprops/action-gh-release@v2
        with:
          files: dist/openautoflutter_example-flutter-drm-${{ matrix.arch }}.tar.gz

      - name: Package flutter-drm debug-symbols bundle (${{ matrix.arch }})
        run: |
          mkdir -p dist
          tar -C dist/flutter-drm-${{ matrix.arch }}-debug -czf dist/openautoflutter_example-flutter-drm-${{ matrix.arch }}-debug.tar.gz .

      - name: Upload flutter-drm debug-symbols asset (${{ matrix.arch }})
        uses: softprops/action-gh-release@v2
        with:
          files: dist/openautoflutter_example-flutter-drm-${{ matrix.arch }}-debug.tar.gz
