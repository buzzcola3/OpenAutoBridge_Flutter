name: Release Builds

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            flutter_arch: x64
            platform: linux/amd64
            image: openautoflutter-builder
          - arch: arm64
            flutter_arch: arm64
            platform: linux/arm64
            image: openautoflutter-builder-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build builder image (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ matrix.image }}
          cache-from: type=gha,scope=builder-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=builder-${{ matrix.arch }}

      - name: Build example app (${{ matrix.arch }})
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            docker run --rm -t --platform ${{ matrix.platform }} \
              -v "$PWD:/workspace" \
              -w /workspace/example \
              ${{ matrix.image }} \
              flutter build linux -v
          else
            docker run --rm -t \
              -v "$PWD:/workspace" \
              -w /workspace/example \
              ${{ matrix.image }} \
              flutter build linux -v
          fi

      - name: Package bundle (${{ matrix.arch }})
        run: |
          mkdir -p dist
          tar -C example/build/linux/${{ matrix.flutter_arch }}/release/bundle -czf dist/openautoflutter_example-linux-${{ matrix.arch }}.tar.gz .

      - name: Upload release asset (${{ matrix.arch }})
        uses: softprops/action-gh-release@v2
        with:
          files: dist/openautoflutter_example-linux-${{ matrix.arch }}.tar.gz

      - name: Build flutter-pi bundle (arm64)
        if: matrix.arch == 'arm64'
        run: |
          docker run --rm -t --platform ${{ matrix.platform }} \
            -v "$PWD:/workspace" \
            -w /workspace \
            ${{ matrix.image }} \
            bash scripts/build_flutter_pi_release_arm64.sh /workspace/example

      - name: Package flutter-pi bundle (arm64)
        if: matrix.arch == 'arm64'
        run: |
          mkdir -p dist
          tar -C dist/flutter-pi-arm64 -czf dist/openautoflutter_example-flutter-pi-arm64.tar.gz .

      - name: Upload flutter-pi release asset (arm64)
        if: matrix.arch == 'arm64'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/openautoflutter_example-flutter-pi-arm64.tar.gz

      - name: Build flutter-pi bundle (amd64)
        if: matrix.arch == 'amd64'
        run: |
          docker run --rm -t \
            -v "$PWD:/workspace" \
            -w /workspace \
            ${{ matrix.image }} \
            bash scripts/build_flutter_pi_release_amd64.sh /workspace/example

      - name: Package flutter-pi bundle (amd64)
        if: matrix.arch == 'amd64'
        run: |
          mkdir -p dist
          tar -C dist/flutter-pi-amd64 -czf dist/openautoflutter_example-flutter-pi-amd64.tar.gz .

      - name: Upload flutter-pi release asset (amd64)
        if: matrix.arch == 'amd64'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/openautoflutter_example-flutter-pi-amd64.tar.gz
