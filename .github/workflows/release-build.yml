name: Release Builds

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            flutter_arch: x64
            platform: linux/amd64
            image: openautoflutter-builder
          - arch: arm64
            flutter_arch: arm64
            platform: linux/arm64
            image: openautoflutter-builder-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build builder image (${{ matrix.arch }})
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            docker buildx build --platform ${{ matrix.platform }} -t ${{ matrix.image }} --load .
          else
            docker build -t ${{ matrix.image }} .
          fi

      - name: Build example app (${{ matrix.arch }})
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            docker run --rm -t --platform ${{ matrix.platform }} \
              -v "$PWD:/workspace" \
              -w /workspace/example \
              ${{ matrix.image }} \
              flutter build linux -v
          else
            docker run --rm -t \
              -v "$PWD:/workspace" \
              -w /workspace/example \
              ${{ matrix.image }} \
              flutter build linux -v
          fi

      - name: Package bundle (${{ matrix.arch }})
        run: |
          mkdir -p dist
          tar -C example/build/linux/${{ matrix.flutter_arch }}/release/bundle -czf dist/openautoflutter_example-linux-${{ matrix.arch }}.tar.gz .

      - name: Upload release asset (${{ matrix.arch }})
        uses: softprops/action-gh-release@v2
        with:
          files: dist/openautoflutter_example-linux-${{ matrix.arch }}.tar.gz
